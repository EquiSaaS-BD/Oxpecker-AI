    <path d="M19 26 L45 26" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M38 18 L27 34" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="39" cy="17" r="2.5" fill="#ffffff" />
    <text x="32" y="55" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#a7f3d0" text-anchor="middle" letter-spacing="1">ESTD 1948</text>
  </g>

  <!-- Typography -->
  <text x="88" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#064e3b" letter-spacing="1">EDRUC</text>
  <text x="89" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#059669" letter-spacing="3">LIMITED</text>
  <text x="210" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#64748b">• PHARMACEUTICALS</text>
