name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs at 00:00 UTC every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Pinging Supabase database endpoint to keep project active..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pc2ppZ2d1bGV5Z2JqY3ZmbWJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMTYzNDIsImV4cCI6MjEwMjg5MjM0Mn0.RffU4Cmu-yDt5BNAm49Kd_ZQjxpJ1NMwwOjGwokFa38' }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pc2ppZ2d1bGV5Z2JqY3ZmbWJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMTYzNDIsImV4cCI6MjEwMjg5MjM0Mn0.RffU4Cmu-yDt5BNAm49Kd_ZQjxpJ1NMwwOjGwokFa38' }}" \
            "https://nisjigguleygbjcvfmbb.supabase.co/rest/v1/profiles?select=count")
          echo "Supabase Response HTTP Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Supabase successfully pinged and is active."
          else
            echo "Warning: Received HTTP $STATUS, but endpoint was reached."
          fi
