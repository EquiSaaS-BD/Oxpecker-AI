name: Oxpecker AI - Deploy Fullstack to Microsoft Azure

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-backend:
    name: 🐍 Deploy FastAPI Backend to Azure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'Backend/requirements.txt'

      - name: Install Python Dependencies Locally
        working-directory: Backend
        run: |
          python -m pip install --upgrade pip
          pip install --target=".python_packages/lib/site-packages" -r requirements.txt

      - name: Create Backend Deployment Package
        run: |
          cd Backend
          zip -r ../backend-deploy.zip . -x "__pycache__/*" "tests/*" "*.git*"

      - name: Deploy to Azure Web App (Backend)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'oxpecker-api'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND }}
          package: './backend-deploy.zip'

  deploy-frontend:
    name: ⚡ Deploy Next.js 15 Frontend to Azure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'Frontend/package.json'

      - name: Install Frontend Dependencies
        working-directory: Frontend
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        working-directory: Frontend
        run: npx prisma generate

      - name: Build Next.js Production Standalone App
        working-directory: Frontend
        env:
          NEXT_PUBLIC_API_URL: 'https://oxpecker-api.azurewebsites.net'
          NEXT_PUBLIC_SUPABASE_URL: 'https://nisjigguleygbjcvfmbb.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: '17336209293-o2nb2ujc7m36cu851qraclb3shrt2g1n.apps.googleusercontent.com'
          NODE_ENV: 'production'
        run: npm run build

      - name: Prepare Standalone Package
        run: |
          mkdir -p Frontend/.next/standalone/public
          mkdir -p Frontend/.next/standalone/.next
          # Copy contents of public directly into standalone/public
          cp -a Frontend/public/. Frontend/.next/standalone/public/
          # Also duplicate into Frontend/public in case Next.js standalone runs with subfolder context
          mkdir -p Frontend/.next/standalone/Frontend/public
          cp -a Frontend/public/. Frontend/.next/standalone/Frontend/public/
          # Copy static build chunks to both paths
          cp -a Frontend/.next/static/. Frontend/.next/standalone/.next/static/
          mkdir -p Frontend/.next/standalone/Frontend/.next
          cp -a Frontend/.next/static/. Frontend/.next/standalone/Frontend/.next/static/
          # Ensure server.js is at root of standalone
          if [ -f Frontend/.next/standalone/Frontend/server.js ] && [ ! -f Frontend/.next/standalone/server.js ]; then
            cp Frontend/.next/standalone/Frontend/server.js Frontend/.next/standalone/server.js
          fi
          cd Frontend/.next/standalone
          zip -r ../../../frontend-deploy.zip .

      - name: Deploy to Azure Web App (Frontend)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'oxpecker-web'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
          package: './frontend-deploy.zip'
